name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Reproducibility: pin to the exact Bun version used in development.
env:
  BUN_VERSION: "1.3.14"

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Lint (ESLint)
        run: bun run lint

      - name: Typecheck (tsc --noEmit)
        run: bunx tsc --noEmit

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: file:./db/custom.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      # The SQLite database is gitignored — create it from the schema so the
      # standalone bundle ships with a working database (see issue #31).
      - name: Provision database
        run: mkdir -p db && bunx prisma db push --accept-data-loss

      - name: Build
        run: bun run build

      - name: Upload standalone bundle
        uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: .next/standalone
          retention-days: 7
          if-no-files-found: error

  smoke:
    name: Standalone smoke test (clean env)
    runs-on: ubuntu-latest
    needs: build
    steps:
      # A bare download — no repo, no node_modules: exactly the deployment
      # shape consumers of the artifact get.
      - name: Download standalone bundle
        uses: actions/download-artifact@v4
        with:
          name: standalone
          path: standalone

      - name: Start & probe
        working-directory: standalone
        env:
          DATABASE_URL: file:./db/custom.db
          PORT: "3100"
          HOSTNAME: 127.0.0.1
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/ > /dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::standalone server did not answer on :3100"
            cat server.log
            exit 1
          fi

          # Golden path against the bundled database.
          echo "--- GET /api/presets ---"
          curl -sf http://127.0.0.1:3100/api/presets
          echo
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3100/logo.svg)
          echo "GET /logo.svg -> $code"
          [ "$code" = "200" ] || { cat server.log; exit 1; }

          kill "$(cat server.pid)"
          echo "smoke test passed: / 200, /api/presets 200, /logo.svg 200"
