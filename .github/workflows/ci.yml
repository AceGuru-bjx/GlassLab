name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Reproducibility: pin to the exact Bun version used in development.
env:
  BUN_VERSION: "1.3.14"

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Lint (ESLint)
        run: bun run lint

      - name: Typecheck (tsc --noEmit)
        run: bunx tsc --noEmit

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: file:./db/custom.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      # The SQLite database is gitignored — create it from the schema so the
      # standalone bundle ships with a working database (see issue #31).
      # Absolute path on purpose: Prisma resolves relative sqlite URLs against
      # the schema directory (prisma/), which silently wrote the db outside
      # the tree the build script copies from.
      - name: Provision database
        run: mkdir -p db && bunx prisma db push --accept-data-loss
        env:
          DATABASE_URL: file:${{ github.workspace }}/db/custom.db

      - name: Build
        run: bun run build

      # tar explicitly — upload-artifact v4 silently drops dot-directories
      # (.next) from plain directory paths, which broke the first smoke run.
      - name: Pack standalone bundle
        run: tar -czf standalone.tgz -C .next/standalone .

      - name: Upload standalone bundle
        uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: standalone.tgz
          retention-days: 7
          if-no-files-found: error

  smoke:
    name: Standalone smoke test (clean env)
    runs-on: ubuntu-latest
    needs: build
    steps:
      # A bare download — no repo, no node_modules: exactly the deployment
      # shape consumers of the artifact get.
      - name: Download standalone bundle
        uses: actions/download-artifact@v4
        with:
          name: standalone
          path: .

      - name: Unpack bundle
        run: mkdir standalone && tar -xzf standalone.tgz -C standalone

      - name: Start & probe
        working-directory: standalone
        env:
          PORT: "3100"
          HOSTNAME: 127.0.0.1
        run: |
          # CWD is the unpacked bundle root — same shape as a real deployment.
          export DATABASE_URL="file:$(pwd)/db/custom.db"
          node server.js > server.log 2>&1 &
          echo $! > server.pid

          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/ > /dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::standalone server did not answer on :3100"
            cat server.log
            exit 1
          fi

          # Golden path against the bundled database.
          echo "--- GET /api/presets ---"
          if ! curl -sf http://127.0.0.1:3100/api/presets; then
            echo
            cat server.log
            exit 1
          fi
          echo
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3100/logo.svg)
          echo "GET /logo.svg -> $code"
          [ "$code" = "200" ] || { cat server.log; exit 1; }

          kill "$(cat server.pid)"
          echo "smoke test passed: / 200, /api/presets 200, /logo.svg 200"
